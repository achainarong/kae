[package]
name = "kae"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A merge-first Git terminal workspace"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
similar = "2"
signal-hook = "0.3"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"

[profile.release]
lto = "thin"
strip = true
