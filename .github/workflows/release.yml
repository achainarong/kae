name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Package / ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tested Rust toolchain and target
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target "$TARGET"
          rustup default 1.96.0
      - name: Validate tag matches Cargo version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kae"))')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG must match Cargo.toml version v$version" >&2
            exit 1
          fi
      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Test the actual release target
        run: cargo test --locked --target "$TARGET"
      - name: Build and smoke-test binary
        run: |
          cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/kae" --version
          "target/$TARGET/release/kae" --help
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist "$RUNNER_TEMP/kae-package"
          cp "target/$TARGET/release/kae" "$RUNNER_TEMP/kae-package/kae"
          tar -czf "dist/kae-$TARGET.tar.gz" -C "$RUNNER_TEMP/kae-package" kae
          python3 - <<'PY'
          import hashlib, os, pathlib
          archive = pathlib.Path('dist', f'kae-{os.environ["TARGET"]}.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + '.sha256').write_text(f'{digest}  {archive.name}\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kae-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kae-*
          merge-multiple: true
          path: dist
      - name: Verify every package and publish without overwriting assets
        shell: bash
        run: |
          cd dist
          archives=(kae-*.tar.gz)
          checksums=(kae-*.tar.gz.sha256)
          test "${#archives[@]}" -eq 3
          test "${#checksums[@]}" -eq 3
          cat "${checksums[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          args=()
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          # create fails for an existing release; deliberately do not use --clobber.
          # Keep the release hidden until every asset upload succeeds.
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${args[@]}" ./*
          gh release edit "$TAG" --draft=false
